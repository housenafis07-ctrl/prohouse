name: Move header utility links

on:
  push:
    branches: [main]

jobs:
  move-links:
    if: ${{ !contains(github.event.head_commit.message, 'move partner links to utility bar') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move partner and listing links
        shell: python
        run: |
          from pathlib import Path

          page = Path('app/page.tsx')
          css = Path('app/globals.css')
          text = page.read_text(encoding='utf-8')

          partner = '<Link className="nav-link" href="#partners">{lang===\'uz\'?\'Hamkorlar uchun\':\'Для партнёров\'}</Link>'
          post = '<Link className="nav-link" href="#post-listing">{text.post}</Link>'

          if partner not in text or post not in text:
              raise SystemExit('Target navigation links were not found; nothing changed.')

          text = text.replace('        ' + partner + '\n        ' + post + '\n', '', 1)

          marker = '<div className="nav">'
          utility = '''<div className="utility-bar"><div className="container utility-inner"><div className="utility-left"><span>⌖ Toshkent</span></div><div className="utility-links"><Link href="#partners">{lang==='uz'?'Hamkorlar uchun':'Для партнёров'}</Link><Link href="#post-listing" className="utility-post">{text.post}</Link></div></div></div>\n      <div className="nav">'''
          if marker not in text:
              raise SystemExit('Header nav marker not found.')
          text = text.replace(marker, utility, 1)
          page.write_text(text, encoding='utf-8')

          css_text = css.read_text(encoding='utf-8')
          rules = '''\n.utility-bar{height:38px;background:#fff;border-bottom:1px solid var(--line)}.utility-inner{height:100%;display:flex;align-items:center;justify-content:space-between}.utility-left{font-size:11px;color:#71808a;font-weight:700}.utility-links{display:flex;align-items:center;gap:24px}.utility-links a{font-size:11px;color:#71808a;text-decoration:none;font-weight:700;white-space:nowrap}.utility-links a:hover{color:var(--green-dark)}.utility-links .utility-post{color:var(--green-dark);font-weight:800}.header{height:110px}.nav{height:72px}@media(max-width:900px){.utility-bar{height:auto;min-height:36px}.utility-inner{padding:0 14px}.utility-left{display:none}.utility-links{width:100%;justify-content:flex-end;gap:16px}.utility-links a{font-size:10px}.header{height:108px}.nav{height:72px}.main-nav{gap:12px}.nav-actions .language-btn,.nav-actions .location-pill{display:none}}@media(max-width:640px){.utility-inner{padding:0 12px}.utility-links{justify-content:space-between;gap:10px}.utility-links a{font-size:10px}.header{height:102px}.nav{height:66px;gap:12px}.main-nav{overflow-x:auto;flex:none;max-width:calc(100vw - 80px);scrollbar-width:none}.main-nav::-webkit-scrollbar{display:none}.brand{font-size:18px}.brand-mark{width:28px;height:28px;font-size:17px}.nav-actions{gap:2px}.nav-actions .round-btn{display:none}.account-btn{padding:9px 10px;font-size:10px}}\n'''
          if '.utility-bar{' not in css_text:
              css.write_text(css_text + rules, encoding='utf-8')

          wf = Path('.github/workflows/move-header-links.yml')
          if wf.exists():
              wf.unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css .github/workflows/move-header-links.yml
          git commit -m "feat: move partner links to utility bar [skip ci]"
          git push
