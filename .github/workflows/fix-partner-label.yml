name: Fix partner label

on:
  push:
    branches:
      - feat/royalhouse-partners

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[partner-label-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/royalhouse-partners
          fetch-depth: 0
      - name: Update label and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = "lang==='ru'?'Для партнёров':'Hamkorlar uchun'"
          new = "lang==='ru'?'Партнёрам':'Hamkorlar uchun'"
          if old not in s:
              raise SystemExit('Expected partner label was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-partner-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx .github/workflows/fix-partner-label.yml
          git commit -m 'fix: partner label in Russian [partner-label-fix]'
          git push origin feat/royalhouse-partners
