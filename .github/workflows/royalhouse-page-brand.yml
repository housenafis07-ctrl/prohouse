name: Fix Royalhouse homepage brand

on:
  push:
    branches:
      - fix/royalhouse-page-freeze

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[brand-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace homepage legacy brand
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')

          replacements = {
              "localStorage.getItem('prohouse-lang')": "localStorage.getItem('royalhouse-lang')",
              "localStorage.setItem('prohouse-lang',v)": "localStorage.setItem('royalhouse-lang',v)",
              'Pro<span className="text-emerald-500">house</span>': 'Royal<span className="text-emerald-500">house</span>',
          }

          old = s
          for a, b in replacements.items():
              s = s.replace(a, b)

          if s == old:
              print('No homepage legacy brand found.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Homepage brand updated.')

      - name: Verify homepage has no visible Prohouse brand
        shell: bash
        run: |
          if grep -n -E 'Prohouse|ProHouse|PROHOUSE' app/page.tsx; then
            echo 'Legacy Prohouse text remains in app/page.tsx'
            exit 1
          fi
          echo 'Homepage brand verification passed.'

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/royalhouse-page-brand.yml
          git add app/page.tsx .github/workflows/royalhouse-page-brand.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: replace remaining homepage Prohouse brand [brand-fix]'
          git push origin HEAD:fix/royalhouse-page-freeze
