name: Patch Telegram onboarding

on:
  push:
    branches:
      - fix/telegram-no-auto-account

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: replace Telegram onboarding message'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace Telegram onboarding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/api/telegram/webhook/route.ts')
          text = path.read_text()

          pattern = r"      if \(!payload\) \{.*?\n      if \(payload\.startsWith\('share_'\)\)"
          replacement = '''      if (!payload) {
        const ru = (from?.language_code || '').toLowerCase().startsWith('ru')
        const intro = ru
          ? '🏠 Добро пожаловать в RoyalHouse!\\n\\nRoyalHouse — платформа недвижимости для поиска жилья, размещения объявлений, управления своими объявлениями и ипотечных сервисов.'
          : '🏠 RoyalHouse’ga xush kelibsiz!\\n\\nRoyalHouse — uy-joy platformasi: uy, kvartira va dachalarni topish, e’lon joylashtirish, e’lonlarni boshqarish va ipoteka xizmatlaridan foydalanish mumkin.'
        const guide = ru
          ? '📱 Как пользоваться RoyalHouse?\\n\\n1️⃣ Нажмите «Royalhouse’ni ochish», чтобы открыть мини-приложение.\\n\\n2️⃣ Найдите нужный дом, квартиру или дачу.\\n\\n3️⃣ Чтобы разместить объявление, выберите «Объявление разместить».\\n\\n4️⃣ В кабинете можно управлять объявлениями, смотреть статистику, продвигать объявления и настраивать профиль.\\n\\n5️⃣ Telegram не создаёт аккаунт RoyalHouse автоматически. Для входа через Telegram сначала зарегистрируйтесь на RoyalHouse и привяжите Telegram в личном кабинете.\\n\\n🔐 Политика конфиденциальности — по кнопке ниже.'
          : '📱 RoyalHouse’dan qanday foydalaniladi?\\n\\n1️⃣ «Royalhouse’ni ochish» tugmasini bosing — Mini App ochiladi.\\n\\n2️⃣ Kerakli uy, kvartira yoki dachani qidiring.\\n\\n3️⃣ E’lon joylashtirish uchun «E’lon joylashtirish» bo‘limini tanlang.\\n\\n4️⃣ Shaxsiy kabinetda e’lonlarni boshqaring, statistika ko‘rsatkichlarini ko‘ring, e’lonlarni ilgari suring va profilingizni sozlang.\\n\\n5️⃣ Telegram orqali avtomatik RoyalHouse akkaunti yaratilmaydi. Telegram orqali kirish uchun avval RoyalHouse’da ro‘yxatdan o‘ting va shaxsiy kabinetdan Telegramni ulang.\\n\\n🔐 Maxfiylik siyosati bilan quyidagi tugma orqali tanishishingiz mumkin.'
        await sendTelegramMessage(chatId, intro)
        await telegramApi('sendMessage', {
          chat_id: chatId,
          text: guide,
          disable_web_page_preview: true,
          reply_markup: {
            inline_keyboard: [
              [{ text: '🚀 Royalhouse’ni ochish', web_app: { url: `${SITE_URL}/telegram` } }],
              [{ text: ru ? '🔐 Политика конфиденциальности' : '🔐 Maxfiylik siyosati', url: `${SITE_URL}/privacy` }],
            ],
          },
        })
        return NextResponse.json({ ok: true })
      }
      if (payload.startsWith('share_'))'''

          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not find Telegram onboarding block')
          path.write_text(updated)
          PY

      - name: Verify and commit
        run: |
          grep -n "Telegram orqali avtomatik RoyalHouse akkaunti yaratilmaydi\|Maxfiylik siyosati\|/privacy" app/api/telegram/webhook/route.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/telegram/webhook/route.ts
          git rm .github/workflows/patch-telegram-onboarding.yml
          git commit -m "fix: replace Telegram onboarding message"
          git push
