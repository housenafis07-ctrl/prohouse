name: Fix RoyalHouse Telegram onboarding

on:
  push:
    branches:
      - feat/telegram-mortgage-scoring-button

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: add RoyalHouse Telegram onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add first-start onboarding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/api/telegram/webhook/route.ts')
          text = path.read_text()

          if 'isFirstTelegramVisit' not in text:
              old = "const from = message.from; const admin = serviceClient(); const telegramUserId = from?.id ? String(from.id) : ''"
              new = "const from = message.from; const admin = serviceClient(); const telegramUserId = from?.id ? String(from.id) : ''; let isFirstTelegramVisit = false"
              if old not in text:
                  raise SystemExit('Could not find Telegram request context line')
              text = text.replace(old, new, 1)

              old = "const { data: existingLink, error: linkLookupError } = await admin.from('telegram_user_links').select('profile_id').eq('telegram_user_id', telegramUserId).maybeSingle()"
              new = "const { data: existingLink, error: linkLookupError } = await admin.from('telegram_user_links').select('profile_id').eq('telegram_user_id', telegramUserId).maybeSingle(); const { data: existingBotUser, error: existingBotUserError } = await admin.from('telegram_bot_users').select('telegram_user_id').eq('telegram_user_id', telegramUserId).maybeSingle(); if (existingBotUserError) throw existingBotUserError; isFirstTelegramVisit = !existingBotUser"
              if old not in text:
                  raise SystemExit('Could not find Telegram bot user lookup line')
              text = text.replace(old, new, 1)

          marker = "      const payload = text.split(/\\s+/, 2)[1] || ''"
          onboarding = '''      const payload = text.split(/\\s+/, 2)[1] || ''
      if (!payload && isFirstTelegramVisit) {
        const ru = (from?.language_code || '').toLowerCase().startsWith('ru')
        const intro = ru
          ? '🏠 Добро пожаловать в RoyalHouse!\\n\\nRoyalHouse — платформа недвижимости, где можно находить дома, квартиры и дачи, размещать объявления, управлять своими объявлениями и пользоваться ипотечными сервисами прямо в Telegram.'
          : '🏠 RoyalHouse’ga xush kelibsiz!\\n\\nRoyalHouse — uy-joy platformasi. Bu yerda uy, kvartira va dachalarni topish, e’lon joylashtirish, e’lonlaringizni boshqarish va ipoteka xizmatlaridan foydalanish mumkin — barchasi Telegram ichida.'
        const guide = ru
          ? '📱 Как пользоваться RoyalHouse?\\n\\n1. Нажмите «Royalhouse’ni ochish», чтобы открыть мини-приложение.\\n2. Выберите поиск дома/квартиры, поиск дачи или размещение объявления.\\n3. Для ипотеки откройте «Ипотека кредитного скоринга» и перейдите к калькулятору.\\n4. Войдите через Telegram — SMS-код не требуется.\\n\\n🔐 Политика конфиденциальности доступна по кнопке ниже.'
          : '📱 RoyalHouse’dan qanday foydalaniladi?\\n\\n1. «Royalhouse’ni ochish» tugmasini bosing — Mini App ochiladi.\\n2. Uy/kvartira topish, dacha topish yoki e’lon joylashtirish bo‘limini tanlang.\\n3. Ipoteka uchun «Ipoteka krediti skoringi» bo‘limiga kirib, kalkulyatorga o‘ting.\\n4. Telegram orqali kiring — SMS kod talab qilinmaydi.\\n\\n🔐 Maxfiylik siyosati quyidagi tugma orqali mavjud.'
        await sendTelegramMessage(chatId, intro)
        await telegramApi('sendMessage', {
          chat_id: chatId,
          text: guide,
          disable_web_page_preview: true,
          reply_markup: {
            inline_keyboard: [
              [{ text: '🚀 Royalhouse’ni ochish', web_app: { url: `${SITE_URL}/telegram` } }],
              [{ text: ru ? '🔐 Политика конфиденциальности' : '🔐 Maxfiylik siyosati', url: `${SITE_URL}/privacy` }],
            ],
          },
        })
        return NextResponse.json({ ok: true })
      }'''
          if onboarding not in text:
              if marker not in text:
                  raise SystemExit('Could not find /start payload marker')
              text = text.replace(marker, onboarding, 1)

          path.write_text(text)
          PY

      - name: Verify and commit
        run: |
          grep -n "isFirstTelegramVisit\|Maxfiylik siyosati\|Политика конфиденциальности\|/privacy" app/api/telegram/webhook/route.ts
          rm -f .github/workflows/fix-telegram-onboarding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/telegram/webhook/route.ts .github/workflows/fix-telegram-onboarding.yml
          git commit -m "fix: add RoyalHouse Telegram onboarding"
          git push
