name: Fix Telegram Mini App launch URL

on:
  push:
    branches:
      - feat/telegram-mortgage-scoring-button

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: point Telegram bot button to Mini App'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix bot Mini App URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/telegram/webhook/route.ts')
          text = path.read_text()
          old = "web_app: { url: SITE_URL }"
          new = "web_app: { url: `${SITE_URL}/telegram` }"
          if old not in text:
              raise SystemExit('Expected Telegram Mini App URL pattern was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-telegram-miniapp-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/telegram/webhook/route.ts .github/workflows/fix-telegram-miniapp-url.yml
          git commit -m "fix: point Telegram bot button to Mini App"
          git push