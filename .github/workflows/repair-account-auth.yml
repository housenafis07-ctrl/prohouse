name: repair-account-auth

on:
  push:
    branches: [fix/account-login-and-loading-final]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-login-and-loading-final
          fetch-depth: 0

      - name: Patch account auth loader
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/account/page.tsx')
          s = p.read_text()

          old = """      try {\n        const { data: { user } } = await supabase.auth.getUser()\n        if (!user) {\n          router.replace('/register')\n          return\n        }\n\n        const { data, error: profileError } = await supabase\n          .from('profiles')\n          .select('phone,full_name,account_type,partner_type,company_name,inn,bank_name,bank_account,mfo,oked,director_full_name,email,instagram_url,facebook_url,linkedin_url,telegram_url')\n          .eq('id', user.id)\n          .maybeSingle()\n"""

          new = """      try {\n        // Browser-side account loading must not depend on a network round-trip\n        // to Supabase Auth. The previous getUser() call could remain pending\n        // after OTP setSession and leave the whole cabinet on Yuklanmoqda... .\n        const authResult = await Promise.race([\n          supabase.auth.getSession(),\n          new Promise<never>((_, reject) => setTimeout(() => reject(new Error('AUTH_SESSION_TIMEOUT')), 5000)),\n        ])\n        const user = authResult.data.session?.user\n        if (!user) {\n          router.replace('/account/login?next=%2Faccount')\n          return\n        }\n\n        const profileResult = await Promise.race([\n          supabase\n            .from('profiles')\n            .select('phone,full_name,account_type,partner_type,company_name,inn,bank_name,bank_account,mfo,oked,director_full_name,email,instagram_url,facebook_url,linkedin_url,telegram_url')\n            .eq('id', user.id)\n            .maybeSingle(),\n          new Promise<never>((_, reject) => setTimeout(() => reject(new Error('PROFILE_QUERY_TIMEOUT')), 8000)),\n        ])\n        const { data, error: profileError } = profileResult\n"""

          if old not in s:
              raise SystemExit('account auth block not found')
          s = s.replace(old, new, 1)

          old_missing = """        if (!data) {\n          router.replace('/register?next=%2Faccount')\n          return\n        }\n"""
          new_missing = """        if (!data) {\n          router.replace('/account/login?next=%2Faccount')\n          return\n        }\n"""
          if old_missing not in s:
              raise SystemExit('account missing-profile redirect not found')
          s = s.replace(old_missing, new_missing, 1)

          p.write_text(s)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-account-auth.yml
          git add app/account/page.tsx .github/workflows/repair-account-auth.yml
          git commit -m "fix: stop account auth loading deadlock" || exit 0
          git push origin HEAD:fix/account-login-and-loading-final
