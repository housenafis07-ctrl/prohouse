name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/royalhouse-global-brand]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      ROYALHOUSE_ADMIN_PASSWORD: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Complete Royalhouse brand migration
        if: github.ref == 'refs/heads/fix/royalhouse-global-brand'
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -Il -e 'Prohouse' -e 'ProHouse' -e 'PROHOUSE' -e 'prohouse' -- app lib data public .env.example package.json next.config.ts 2>/dev/null || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              python - "$file" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
s = p.read_text(encoding='utf-8')
s = s.replace('Prohouse', 'Royalhouse')
s = s.replace('ProHouse', 'RoyalHouse')
s = s.replace('PROHOUSE', 'ROYALHOUSE')
s = s.replace('prohouse', 'royalhouse')
p.write_text(s, encoding='utf-8')
PY
            done <<< "$files"
          fi
          if git diff --quiet; then
            echo "No legacy Prohouse branding found in runtime files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib data public .env.example package.json next.config.ts
          git commit -m "chore: complete Royalhouse brand migration"
          git push origin HEAD:${GITHUB_REF_NAME}
