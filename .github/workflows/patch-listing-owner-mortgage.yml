name: Patch listing owner and mortgage selection

on:
  push:
    paths:
      - '.github/workflows/patch-listing-owner-mortgage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch listing form and cabinet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/listings/new/page.tsx')
          s = p.read_text()

          old = "  const [location, setLocation] = useState({ latitude: null as number | null, longitude: null as number | null })\n  const [form, setForm] = useState({ taxonomy_code: '', listing_type: 'sale', property_type: 'apartment', title: '', description: '', price: '', currency: 'UZS', area_m2: '', rooms: '', floor: '', floors_total: '', city: 'Toshkent', district: '', address: '', contact_phone: '', service_area: '', experience_years: '', company_name: '' })"
          new = "  const [location, setLocation] = useState({ latitude: null as number | null, longitude: null as number | null })\n  const [sellerRole, setSellerRole] = useState<'owner' | 'seller' | ''>('')\n  const [mortgageAvailable, setMortgageAvailable] = useState(false)\n  const [form, setForm] = useState({ taxonomy_code: '', listing_type: 'sale', property_type: 'apartment', title: '', description: '', price: '', currency: 'UZS', area_m2: '', rooms: '', floor: '', floors_total: '', city: 'Toshkent', district: '', address: '', contact_phone: '', service_area: '', experience_years: '', company_name: '' })"
          if old not in s:
              raise SystemExit('state marker not found')
          s = s.replace(old, new, 1)

          old = "    if (!selectedTaxonomy) return setError('Bo‘lim va bo‘linmani tanlang.')\n    const price = Number(form.price.replace(/\\s/g, ''))"
          new = "    if (!selectedTaxonomy) return setError('Bo‘lim va bo‘linmani tanlang.')\n    if (mode === 'property' && !sellerRole) return setError('E’lonni joylashtirishdan oldin mulk egasi ekanligingizni yoki sotuvchi ekanligingizni belgilang.')\n    const price = Number(form.price.replace(/\\s/g, ''))"
          if old not in s:
              raise SystemExit('validation marker not found')
          s = s.replace(old, new, 1)

          old = "        seller_type: isIndividual ? 'owner' : 'realtor',\n        seller_name: form.company_name.trim() || profile.full_name?.trim() || null,"
          new = "        seller_type: mode === 'property' ? sellerRole : (isIndividual ? 'owner' : 'realtor'),\n        seller_role: mode === 'property' ? sellerRole : (isIndividual ? 'owner' : 'realtor'),\n        is_mortgage_available: mode === 'property' && (form.listing_type === 'sale' || form.listing_type === 'new_building') ? mortgageAvailable : false,\n        seller_name: form.company_name.trim() || profile.full_name?.trim() || null,"
          if old not in s:
              raise SystemExit('payload marker not found')
          s = s.replace(old, new, 1)

          marker = '        <div><h2 className="text-lg font-extrabold">2. '
          if marker not in s:
              raise SystemExit('section 2 marker not found')
          block = '''        {mode === 'property' && <div className="rounded-2xl border border-slate-200 bg-slate-50 p-5">\n          <h2 className="text-lg font-extrabold">2. E’lon egasi va sotuv shartlari</h2>\n          <p className="mt-1 text-sm text-slate-500">Bu ma’lumotlar avtomatik belgilanmaydi. E’lonni joylashtirishdan oldin o‘zingiz tanlaysiz.</p>\n          <div className="mt-4 grid gap-3 sm:grid-cols-2">\n            <label className={`flex cursor-pointer items-start gap-3 rounded-2xl border p-4 ${sellerRole === 'owner' ? 'border-emerald-500 bg-white ring-2 ring-emerald-100' : 'border-slate-200 bg-white'}`}>\n              <input type="radio" name="seller-role" checked={sellerRole === 'owner'} onChange={() => setSellerRole('owner')} className="mt-1" />\n              <span><b className="block">Mulk egasiman</b><span className="mt-1 block text-xs text-slate-500">E’lon bevosita mulk egasidan.</span></span>\n            </label>\n            <label className={`flex cursor-pointer items-start gap-3 rounded-2xl border p-4 ${sellerRole === 'seller' ? 'border-emerald-500 bg-white ring-2 ring-emerald-100' : 'border-slate-200 bg-white'}`}>\n              <input type="radio" name="seller-role" checked={sellerRole === 'seller'} onChange={() => setSellerRole('seller')} className="mt-1" />\n              <span><b className="block">Mulk egasi emasman</b><span className="mt-1 block text-xs text-slate-500">Sotuvchi yoki vakil sifatida e’lon berilmoqda.</span></span>\n            </label>\n          </div>\n          {(form.listing_type === 'sale' || form.listing_type === 'new_building') && <label className="mt-4 flex cursor-pointer items-start gap-3 rounded-2xl border border-slate-200 bg-white p-4">\n            <input type="checkbox" checked={mortgageAvailable} onChange={e => setMortgageAvailable(e.target.checked)} className="mt-1" />\n            <span><b className="block">Ipotekaga sotish mumkin</b><span className="mt-1 block text-xs text-slate-500">Xaridor bank ipotekasi orqali sotib olishi mumkin bo‘lsa belgilang.</span></span>\n          </label>}\n        </div>\n\n'''
          s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          # Keep the user's explicit seller/mortgage choices visible in My Listings.
          p = Path('app/account/listings/page.tsx')
          s = p.read_text()
          s = s.replace("  moderation_note: string | null; sold_or_rented_at: string | null; taxonomy_code: string | null", "  moderation_note: string | null; sold_or_rented_at: string | null; taxonomy_code: string | null; seller_type: string | null; seller_role: string | null; is_mortgage_available: boolean")
          s = s.replace("moderation_note,sold_or_rented_at,taxonomy_code,listing_images", "moderation_note,sold_or_rented_at,taxonomy_code,seller_type,seller_role,is_mortgage_available,listing_images")
          old = "<span className={`rounded-full px-3 py-1 text-xs font-bold ${statusClass}`}>{statusInfo?.label || item.status}</span>{item.is_trusted_seller && <span"
          new = "<span className={`rounded-full px-3 py-1 text-xs font-bold ${statusClass}`}>{statusInfo?.label || item.status}</span>{item.seller_type === 'owner' && <span className=\"rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700\">Egadan</span>}{item.is_mortgage_available && <span className=\"rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700\">Ipotekaga mumkin</span>}{item.is_trusted_seller && <span"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/listings/new/page.tsx app/account/listings/page.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat(listings): require seller role and capture mortgage eligibility'
          git push origin HEAD:main
