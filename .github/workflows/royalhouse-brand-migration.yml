name: Royalhouse brand migration

on:
  push:
    branches:
      - fix/royalhouse-global-brand

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy Prohouse branding in runtime files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -Il -e 'Prohouse' -e 'ProHouse' -e 'PROHOUSE' -e 'prohouse' -- app lib data public .env.example package.json next.config.ts 2>/dev/null || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              python - "$file" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
s = p.read_text(encoding='utf-8')
s = s.replace('Prohouse', 'Royalhouse')
s = s.replace('ProHouse', 'RoyalHouse')
s = s.replace('PROHOUSE', 'ROYALHOUSE')
s = s.replace('prohouse', 'royalhouse')
p.write_text(s, encoding='utf-8')
PY
            done <<< "$files"
          fi

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No legacy Prohouse branding found in runtime files."
            exit 0
          fi
          git add app lib data public .env.example package.json next.config.ts
          git commit -m "chore: complete Royalhouse brand migration"
          git push
