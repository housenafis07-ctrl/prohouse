name: Remove header all-offers link
on:
  push:
    branches:
      - fix/remove-header-all-offers
permissions:
  contents: write
jobs:
  remove-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove header link only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='<Link href="/listings">{text.allOffers}</Link></nav>'
          if old not in s:
              raise SystemExit('Target header link not found')
          p.write_text(s.replace(old,'</nav>',1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Remove Barchasini ko'rish from header"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/remove-header-all-offers.yml
          git commit -m "Remove temporary workflow"
          git push
