name: Fix Royalhouse language storage key

on:
  push:
    branches:
      - fix/royalhouse-page-freeze

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip language-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align global language bridge with Royalhouse key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/components/GlobalLanguageFix.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("localStorage.getItem('prohouse-lang')", "localStorage.getItem('royalhouse-lang')")
          s = s.replace("event.key === 'prohouse-lang'", "event.key === 'royalhouse-lang'")
          s = s.replace("addEventListener('prohouse-language-change'", "addEventListener('royalhouse-language-change'")
          s = s.replace("removeEventListener('prohouse-language-change'", "removeEventListener('royalhouse-language-change'")
          p.write_text(s, encoding='utf-8')
          PY

          grep -n "localStorage.getItem\|event.key ===\|language-change" app/components/GlobalLanguageFix.tsx

      - name: Verify no legacy language key remains in global bridge
        shell: bash
        run: |
          if grep -n "prohouse-lang\|prohouse-language-change" app/components/GlobalLanguageFix.tsx; then
            echo 'Legacy language key remains.'
            exit 1
          fi

      - name: Commit language fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/components/GlobalLanguageFix.tsx
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: align global language bridge with Royalhouse key [skip language-fix]'
          git push origin HEAD:fix/royalhouse-page-freeze
