name: Patch public listing badges

on:
  push:
    paths:
      - '.github/workflows/patch-public-listing-badges.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch public listing card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/listings/page.tsx')
          s = p.read_text()
          old = "{x.is_trusted_seller&&<span className=\"absolute bottom-3 left-3 rounded-full bg-emerald-50 px-2.5 py-1.5 text-[11px] font-extrabold text-emerald-700\">✓ {lang==='ru'?'Надёжный профиль':'Ishonchli profil'}</span>}"
          new = "{x.is_trusted_seller&&<span className=\"absolute bottom-3 left-3 rounded-full bg-emerald-50 px-2.5 py-1.5 text-[11px] font-extrabold text-emerald-700\">✓ {lang==='ru'?'Надёжный профиль':'Ishonchli profil'}</span>}{x.seller_type==='owner'&&<span className=\"absolute bottom-3 right-3 rounded-full bg-white px-2.5 py-1.5 text-[11px] font-extrabold text-emerald-700\">{lang==='ru'?'От владельца':'Egadan'}</span>}"
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('public card badge marker not found')
          p.write_text(s)

          p = Path('app/listings/[id]/page.tsx')
          if p.exists():
              s = p.read_text()
              # Add seller/mortgage facts beside the existing seller block without changing routing or data flow.
              marker = "{listing.seller_name"
              if marker in s and "listing.is_mortgage_available" not in s:
                  s = s.replace(marker, "{listing.seller_type==='owner' && <span className=\"rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700\">Egadan</span>}{listing.is_mortgage_available && <span className=\"rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700\">Ipotekaga mumkin</span>}{listing.seller_name", 1)
                  p.write_text(s)
          PY

      - name: Commit public badge patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/listings/page.tsx 'app/listings/[id]/page.tsx'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat(listings): show owner and mortgage badges on public listings'
          git push origin HEAD:main
