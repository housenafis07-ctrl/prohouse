<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royalhouse — Bino soyasini ko‘rish</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a}.wrap{max-width:900px;margin:40px auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0f172a12}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-size:13px;font-weight:700;color:#475569}input{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:12px}button{margin-top:18px;padding:13px 18px;border:0;border-radius:12px;background:#00a86b;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:20px;padding:18px;border-radius:16px;background:#ecfdf5}.muted{color:#64748b;font-size:13px}@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{margin:10px auto;padding:12px}}</style></head><body><main class="wrap"><div class="card"><h1>☀️ Bino soyasini ko‘rish</h1><p class="muted">Bino balandligi, joylashuvi, sana va vaqt asosida quyosh balandligi va taxminiy soya uzunligini hisoblang.</p><div class="grid"><label>Bino balandligi (m)<input id="height" type="number" value="10" min="0.1" step="0.1"></label><label>Kenglik (°)<input id="lat" type="number" value="41.31" step="0.0001"></label><label>Sana<input id="date" type="date"></label><label>Vaqt<input id="time" type="time" value="12:00"></label></div><button id="calc">Hisoblash</button><div id="result" class="result" hidden></div></div></main><script>const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);function rad(x){return x*Math.PI/180}function deg(x){return x*180/Math.PI}function calc(){const H=+$('height').value,lat=+$('lat').value,date=$('date').value,time=$('time').value;if(!H||!lat||!date||!time)return;const d=new Date(date+'T'+time+':00');const day=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);const decl=23.44*Math.sin(rad(360*(284+day)/365));const solarNoon=12;const hours=d.getHours()+d.getMinutes()/60;const hourAngle=15*(hours-solarNoon);const sinAlt=Math.sin(rad(lat))*Math.sin(rad(decl))+Math.cos(rad(lat))*Math.cos(rad(decl))*Math.cos(rad(hourAngle));const altitude=deg(Math.asin(sinAlt));const r=$('result');if(altitude<=0){r.hidden=false;r.innerHTML='<b>Quyosh ufqdan past.</b><br>Tanlangan sana va vaqtda bino soyasi hisoblanmaydi.';return}const shadow=H/Math.tan(rad(altitude));r.hidden=false;r.innerHTML='<b>Natija</b><br>Quyosh balandligi: '+altitude.toFixed(1)+'°<br>Taxminiy soya uzunligi: <b>'+shadow.toFixed(2)+' m</b><br><span class="muted">Bu boshlang‘ich astronomik hisob-kitob bo‘lib, keyingi versiyada xarita, azimut va 3D vizualizatsiya qo‘shilishi mumkin.</span>'}$('calc').onclick=calc;</script></body></html>
